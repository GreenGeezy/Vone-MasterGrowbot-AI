apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

// THIS WAS MISSING. It tells the app to compile your Capacitor plugins (like RevenueCat).
apply from: 'capacitor.build.gradle'

android {
    namespace "com.mastergrowbot.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.mastergrowbot.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        // Increment for each Google Play release.
        versionCode 155
        versionName "1.0.155"
        // This is RevenueCat's public, platform-specific Google client key.
        buildConfigField "String", "REVENUECAT_ANDROID_API_KEY", '"goog_kqOynvNRCABzUPrpfyFvlMvHUna"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("CM_KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("CM_KEYSTORE_PASSWORD")
            keyAlias System.getenv("CM_KEY_ALIAS")
            keyPassword System.getenv("CM_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // STANDARD DEPENDENCIES
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"

    // Capacitor & Firebase
    implementation project(':capacitor-android')
    // Application.onCreate owns RevenueCat configuration. Keep this aligned
    // with purchases-capacitor 11.3.2's resolved Android SDK.
    implementation "com.revenuecat.purchases:purchases:9.18.0"
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    
    // CRITICAL FIXES
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.play:review:$playReviewVersion"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
