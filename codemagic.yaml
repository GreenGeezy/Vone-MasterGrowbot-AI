workflows:
  android-release:
    name: MasterGrowbot Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - production
        - app_config
      vars:
        CM_KEYSTORE_PATH: /tmp/keystore.jks
      node: 20.11.1
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps
      
      - name: Build Web Assets
        script: |
          npm run build
      
      - name: Sync Capacitor Plugins
        script: |
          npx cap sync android
      
      - name: Decode Security Files
        script: |
          if [ -n "$CM_KEYSTORE_ENCODED" ]; then
              echo $CM_KEYSTORE_ENCODED | base64 --decode > /tmp/keystore.jks
          else
              echo "Using debug keystore (CodeMagic artifact)"
          fi

          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
              echo $ANDROID_GOOGLE_SERVICES_JSON | base64 --decode > android/app/google-services.json
          fi
      
      - name: Build Android App Bundle
        script: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - Agcomsol@gmail.com

  ios-app-store:
    name: MasterGrowbot iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_STORE_APPLE_ID: "6752221060"
      groups:
        - ios-config # This MUST match the group name you created
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mastergrowbot.ai
      node: 20.11.1
      xcode: 26.6
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios # Only builds on the 'ios' branch
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps
      
      - name: Build Web App
        script: |
          set -e
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing public Supabase key in ios-config"; exit 1; }
          test -n "$VITE_REVENUECAT_IOS_KEY" || { echo "Missing public RevenueCat iOS key in ios-config"; exit 1; }
          case "$VITE_REVENUECAT_IOS_KEY" in appl_*) ;; *) echo "RevenueCat iOS builds require an App Store public SDK key (appl_ prefix)"; exit 1 ;; esac
          npm run typecheck
          npm run test:reliability
          npm run test:premium
          node --test scripts/plan-copy.test.mjs
          npm run test:sharing
          npm run test:library
          npm run test:growth
          npm run validate:strains
          node scripts/validate-premium-library.mjs
          npm run build
          npx cap sync ios
          cat ios/App/Podfile.lock
            
      - name: Set up keychain to be used for code signing using fetched certificates
        script: |
          keychain initialize
          keychain add-certificates
          
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Set a new iOS build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*) echo "Apple returned an invalid build number: $LATEST_BUILD_NUMBER"; exit 1 ;;
          esac
          # Keep retries above the last shipped build, even if Apple's list is delayed.
          case "${BUILD_NUMBER:-}" in
            ''|*[!0-9]*) echo "Missing numeric Codemagic BUILD_NUMBER"; exit 1 ;;
          esac
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          MINIMUM_BUILD_NUMBER=$((182 + BUILD_NUMBER))
          if [ "$NEXT_BUILD_NUMBER" -lt "$MINIMUM_BUILD_NUMBER" ]; then
            NEXT_BUILD_NUMBER=$MINIMUM_BUILD_NUMBER
          fi
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          ACTUAL_BUILD_NUMBER=$(agvtool what-version -terse)
          test "$ACTUAL_BUILD_NUMBER" = "$NEXT_BUILD_NUMBER" || { echo "Xcode build number was not updated"; exit 1; }
          echo "Archiving iOS build $NEXT_BUILD_NUMBER (latest uploaded build $LATEST_BUILD_NUMBER)"

      - name: Build IPA for App Store
        script: |
          echo "=== AVAILABLE CODE SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning
          
          # Build the archive and IPA using the profile we just set
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --config Release \
            --archive-flags "-destination 'generic/platform=iOS'" || (echo "=== XCODEBUILD FAILURE LOG ===" && cat /tmp/xcodebuild_logs/*.log && exit 1)

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "*.DS_Store"

    integrations:
      app_store_connect: Codemagic LLC Final Key
      
    publishing:
      email:
        recipients:
          - Agcomsol@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
