workflows:
  android-release:
    name: MasterGrowbot Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - production
        - app_config
      vars:
        CM_KEYSTORE_PATH: /tmp/keystore.jks
      node: 20.11.1
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Install Android 16 SDK
        script: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ] && [ -x "/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_ROOT="/usr/local/share/android-sdk"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found under the configured SDK root: $SDK_ROOT" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > android/local.properties
          test -d "$SDK_ROOT/platforms/android-36"
      
      - name: Build Web Assets
        script: |
          npm run build
      
      - name: Sync Capacitor Plugins
        script: |
          npx cap sync android
      
      - name: Decode Security Files
        script: |
          : "${CM_KEYSTORE_ENCODED:?CM_KEYSTORE_ENCODED is required}"
          : "${CM_KEYSTORE_PASSWORD:?CM_KEYSTORE_PASSWORD is required}"
          : "${CM_KEY_ALIAS:?CM_KEY_ALIAS is required}"
          : "${CM_KEY_PASSWORD:?CM_KEY_PASSWORD is required}"
          : "${ANDROID_GOOGLE_SERVICES_JSON:?ANDROID_GOOGLE_SERVICES_JSON is required}"
          printf '%s' "$CM_KEYSTORE_ENCODED" | base64 --decode > "$CM_KEYSTORE_PATH"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          test -s "$CM_KEYSTORE_PATH"
          test -s android/app/google-services.json
      
      - name: Build Android App Bundle
        script: |
          cd android
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean :app:lintRelease :app:test :app:bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - Agcomsol@gmail.com
